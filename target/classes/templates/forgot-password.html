<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <title>Forgot Password | Shine Public School</title>

    <link href="//fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/assets/css/style-starter.css}"/>
    <link rel="stylesheet" th:href="@{/assets/css/animate.min.css}"/>
</head>

<body>

<!-- header -->
<div th:replace="~{header :: header}"></div>

<section class="inner-banner py-6 vh-100">

    <div class="mask d-flex align-items-center h-100 gradient-custom-3 py-lg-5 animate__animated">

        <div class="container py-lg-6">

            <div class="row d-flex justify-content-center align-items-center h-10">

                <div class="col-12 col-md-9 col-sm-2 col-xl-6">

                    <div class="card" style="border-radius: 15px">

                        <div class="card-body p-5">

                            <h2 class="text-uppercase text-center mb-5 fs-3">
                                Forgot Password
                            </h2>

                            <!-- messages -->
                            <p class="alert alert-danger"
                               th:if="${error}"
                               th:text="${error}">
                            </p>

                            <p class="alert alert-success"
                               th:if="${success}"
                               th:text="${success}">
                            </p>

                            <!-- form -->
                            <form th:action="@{/public/forgot-password}" method="post">

                                <div class="form-outline mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email"
                                           name="email"
                                           class="form-control form-control-md"
                                           required/>
                                </div>

                                <div class="form-outline mb-3">
                                    <label class="form-label">New Password</label>
                                    <input type="password"
                                           name="newPassword"
                                           class="form-control form-control-md"
                                           required/>
                                </div>

                                <div class="form-outline mb-3">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password"
                                           name="confirmPassword"
                                           class="form-control form-control-md"
                                           required/>
                                </div>

                                <div class="d-flex justify-content-center mt-4">
                                    <button class="btn btn-primary btn-md gradient-custom-4 text-center w-50 rounded-pill">
                                        Reset Password
                                    </button>
                                </div>

                                <p class="text-center text-muted mt-3 mb-0">
                                    Remember password?
                                    <a th:href="@{/login}" class="fw-bold">Login</a>
                                </p>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- footer -->
<div th:replace="~{footer :: footer}"></div>

</body>
</html>
