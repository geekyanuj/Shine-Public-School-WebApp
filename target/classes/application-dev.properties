spring.application.name=Shine-Public-School-WebApp
server.servlet.context-path=/shinepublicschool

# =========================
# THYMELEAF
# =========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/shine_school
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================
# Do NOT let Hibernate create/validate schema
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none

# =========================
# SQL INIT
# =========================
# Execute schema.sql and data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# =========================
# REST API
# =========================
spring.data.rest.basePath=/data-api

# =========================
# LOGGING
# =========================
logging.level.root=INFO
logging.level.com.shinepublicschool=ERROR
logging.level.com.shinepublicschool.controller=TRACE

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=*