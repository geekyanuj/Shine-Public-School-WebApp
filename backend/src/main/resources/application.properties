spring.application.name=Shine-Public-School-WebApp

# =========================
# SERVER
# =========================
server.port=${SPRING_PORT:8080}

# =========================
# DATABASE (PostgreSQL)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shine_school}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shine_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shine_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none

# =========================
# SQL INIT
# =========================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=false

# =========================
# JWT
# =========================
shinepublicschool.jwt.secret=${JWT_SECRET:shine-public-school-default-dev-secret-key-change-in-production}
shinepublicschool.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================
# CORS
# =========================
shinepublicschool.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# =========================
# LOGGING
# =========================
logging.level.root=INFO
logging.level.com.shinepublicschool=DEBUG

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info,metrics

# =========================
# CUSTOM CONFIG
# =========================
shinepublicschool.contact.pageSize=10