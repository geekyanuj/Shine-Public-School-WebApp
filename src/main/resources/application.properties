spring.application.name=Shine-Public-School-WebApp

# =========================
# SERVER
# =========================
server.port=${PORT:8080}

# =========================
# THYMELEAF
# =========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =========================
# DATABASE (RAILWAY MYSQL)
# =========================
spring.datasource.url=jdbc:mysql://mysql.railway.internal:3306/railway
spring.datasource.username=root
spring.datasource.password=ADEbgTdyaqffLiExDyUlzZtQViaPvHEs
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none

# =========================
# SQL INIT
# =========================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=false

# =========================
# REST API
# =========================
spring.data.rest.basePath=/data-api

# =========================
# LOGGING
# =========================
logging.level.root=INFO
logging.level.com.shinepublicschool=DEBUG
logging.level.org.springframework.core.env=DEBUG

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=*

# =========================
# CUSTOM CONFIG
# =========================
shinepublicschool.contact.pageSize=10 